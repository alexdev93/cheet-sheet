name: knowledge-center

# Secrets (DATABASE_URL, SESSION_SECRET, ADMIN_*, ...) come from the
# "cheet-sheet" project in your envvault (envvault.alexdev93.workers.dev),
# fetched at container start -- not from a local .env or a bundled db
# service. Put ENV_VAULT_TOKEN in .env (copy .env.example) before running
# `docker compose up`; DATABASE_URL in that vault project must point at a
# Postgres instance this container can actually reach (not "localhost").

services:
  migrate:
    build:
      context: .
      target: builder
    environment:
      ENV_VAULT_TOKEN: ${ENV_VAULT_TOKEN}
    command: ["envvault", "run", "cheet-sheet", "--", "npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      ENV_VAULT_TOKEN: ${ENV_VAULT_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - attachments_data:/app/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  attachments_data:
