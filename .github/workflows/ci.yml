name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
          POSTGRES_DB: knowledge_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge_center"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://knowledge:knowledge@localhost:5432/knowledge_center?schema=public
      SESSION_SECRET: ci-only-secret-not-used-anywhere-real-0000000000
      ADMIN_EMAIL: admin@example.com
      # bcrypt hash of "ci-placeholder" — never used to authenticate anything real.
      ADMIN_PASSWORD_HASH: "$2a$12$K8Z1r6nY6m1E8F3iH2v3YOQnQwYV1cQe3m9m7m4x2yq2b0mYX2sHW"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # No package-lock.json is committed yet (generate one with `npm
          # install` and commit it, then restore `cache: npm` here and switch
          # the install step below back to `npm ci` for reproducible builds).

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed demo content (validates the seed script end to end)
        run: npm run db:seed

      - name: Build
        run: npm run build
