name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # `next build` needs a syntactically valid DATABASE_URL to generate the
      # Prisma client and prerender pages — it's never actually connected to
      # (same reasoning as the Dockerfile's own build-time placeholder).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      # Real secrets (the same ones local dev and the deployed app use) come
      # from the "cheet-sheet" envvault project via `envvault run`-wrapped npm
      # scripts (db:migrate:deploy, db:seed, ...) below — this token is the
      # only thing CI needs on top of the placeholder above.
      ENV_VAULT_TOKEN: ${{ secrets.ENV_VAULT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # No package-lock.json is committed yet (generate one with `npm
          # install` and commit it, then restore `cache: npm` here and switch
          # the install step below back to `npm ci` for reproducible builds).

      - name: Install envvault
        run: |
          curl -fsS https://env-vault-api.alexdev93.workers.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed demo content (validates the seed script end to end)
        run: npm run db:seed

      - name: Build
        run: npm run build
